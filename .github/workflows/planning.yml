name: Actualisation du Planning

on:
  schedule:
    - cron: '0 6 * * *'  # Tous les jours à 8h (heure française)
  workflow_dispatch:      # Lancement manuel

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests icalendar pandas openpyxl urllib3 tzdata

      - name: Exécuter le script
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python update_planning.py

      - name: Déployer sur gh-pages (PowerShell)
        shell: powershell
        run: |
          # 1. Ajout du chemin Git au PATH
          $env:Path += ";C:\Program Files\Git\cmd;C:\Program Files\Git\bin"

          # 2. Copie directe du fichier généré vers index.html
          Copy-Item Planning_Voitures_Tallard.html index.html -Force

          # 3. Configuration de l'identité Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 4. Bascule sur la branche orphan gh-pages-temp sans effacer le répertoire de travail
          git checkout --orphan gh-pages-temp

          # 5. Ajout explicite des fichiers de rendu à l'index Git
          git add -f index.html
          if (Test-Path Planning_Voitures_Tallard.xlsx) { 
              git add -f Planning_Voitures_Tallard.xlsx 
          }

          # 6. Commit et Push forcé vers la branche distante gh-pages
          git commit -m "🤖 Mise à jour automatique du planning"
          git push origin gh-pages-temp:gh-pages --force

          # 7. Nettoyage : retour à la branche principale
          git checkout main -f
          git branch -D gh-pages-temp
