name: Actualisation du Planning

on:
  schedule:
    - cron: '0 6 * * *'  # Exécution automatique tous les jours à 8h (heure française)
  workflow_dispatch:      # Permet de lancer l'exécution à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests icalendar pandas openpyxl urllib3

      - name: Exécuter le script
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python update_planning.py

      - name: Préparer les fichiers (PowerShell)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path public
          Copy-Item Planning_Voitures_Tallard.html public\index.html
          if (Test-Path Planning_Voitures_Tallard.xlsx) { Copy-Item Planning_Voitures_Tallard.xlsx public\ }

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
        env:
          PATH: "C:\\Program Files\\Git\\usr\\bin;${{ env.PATH }}"

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
