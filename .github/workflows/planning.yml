name: Actualisation du Planning

on:
  schedule:
    - cron: '0 6 * * *'  # Tous les jours à 8h (heure française)
  workflow_dispatch:      # Lancement manuel

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # data.json publié lors de la synchro précédente : sert à détecter
      # les cours ajoutés / modifiés / annulés (onglet « Changements »).
      - name: Récupérer la synchro précédente
        shell: cmd
        run: |
          set "PATH=%PATH%;C:\Program Files\Git\cmd"
          if not exist docs mkdir docs
          git fetch origin gh-pages
          git show origin/gh-pages:data.json > docs\data.json 2>nul || del docs\data.json
          exit /b 0

      - name: Exécuter le script
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python generer.py

      - name: Déployer sur gh-pages (PowerShell)
        shell: powershell
        run: |
          # 1. Ajout du chemin Git au PATH
          $env:Path += ";C:\Program Files\Git\cmd;C:\Program Files\Git\bin"

          # 2. Configuration de l'identité Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Nettoyage préventif
          git checkout main -f
          if (git branch --list gh-pages-temp) { git branch -D gh-pages-temp }

          # 4. Copie de la page générée (et de ses données) à la racine
          Copy-Item docs\index.html index.html -Force
          Copy-Item docs\data.json data.json -Force

          # 5. Création de la branche orpheline
          git checkout --orphan gh-pages-temp

          # 6. Ajout des fichiers de rendu
          git add -f index.html data.json

          # 7. Commit et Push forcé
          git commit -m "🤖 Mise à jour automatique du planning"
          git push origin gh-pages-temp:gh-pages --force

          # 8. Nettoyage final propre
          git checkout main -f
          git branch -D gh-pages-temp
