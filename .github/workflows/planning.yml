name: Actualisation du Planning

on:
  schedule:
    - cron: '0 6 * * *'  # Tous les jours à 8h (heure française)
  workflow_dispatch:      # Lancement manuel

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests icalendar pandas openpyxl urllib3

      - name: Exécuter le script
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python update_planning.py

      - name: Déployer sur gh-pages (PowerShell)
        shell: powershell
        run: |
          # 1. Ajout du chemin Git au PATH
          $env:Path += ";C:\Program Files\Git\cmd;C:\Program Files\Git\bin"

          # 2. Vérification/Initialisation du dépôt Git local si nécessaire
          if (-not (Test-Path .git)) {
              git init
              git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          }

          # 3. Configuration de l'identité Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 4. Création/bascule sur la branche orphan gh-pages-temp
          git checkout --orphan gh-pages-temp

          # 5. Nettoyage de l'index et préparation du dossier public
          git rm -rf . -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path public
          Copy-Item Planning_Voitures_Tallard.html public\index.html
          if (Test-Path Planning_Voitures_Tallard.xlsx) { Copy-Item Planning_Voitures_Tallard.xlsx public\ }

          # 6. Déplacement des fichiers à la racine
          Move-Item public\* . -Force
          Remove-Item public -Recurse -Force

          # 7. Commit et Push forcé vers la branche gh-pages
          git add index.html
          if (Test-Path Planning_Voitures_Tallard.xlsx) { git add Planning_Voitures_Tallard.xlsx }
          git commit -m "Mise à jour automatique du planning"
          git push origin gh-pages-temp:gh-pages --force
