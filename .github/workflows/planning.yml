name: Actualisation du Planning

on:
  schedule:
    - cron: '0 6 * * *'  # Tous les jours à 8h (heure française)
  workflow_dispatch:      # Lancement manuel

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests icalendar pandas openpyxl urllib3

      - name: Exécuter le script
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python update_planning.py

      - name: Déployer sur gh-pages (PowerShell)
        shell: powershell
        run: |
          # 1. Recherche dynamique de git.exe sur la machine
          $gitPath = (Get-Command git.exe -ErrorAction SilentlyContinue).Source
          if (-not $gitPath) {
              $possiblePaths = @(
                  "$env:ProgramFiles\Git\cmd\git.exe",
                  "$env:LocalAppData\Programs\Git\cmd\git.exe",
                  "C:\Program Files (x86)\Git\cmd\git.exe"
              )
              foreach ($p in $possiblePaths) {
                  if (Test-Path $p) { $gitPath = $p; break }
              }
          }

          if (-not $gitPath) {
              Throw "Git n'a pas été trouvé sur la machine."
          }

          # Définition d'un alias pour utiliser 'git' de manière transparente
          Set-Alias -Name git -Value $gitPath

          # 2. Configuration de l'identité Git pour le commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Création/bascule sur la branche orphan gh-pages-temp
          git checkout --orphan gh-pages-temp

          # 4. Nettoyage de l'index et préparation des fichiers
          git rm -rf .
          New-Item -ItemType Directory -Force -Path public
          Copy-Item Planning_Voitures_Tallard.html public\index.html
          if (Test-Path Planning_Voitures_Tallard.xlsx) { Copy-Item Planning_Voitures_Tallard.xlsx public\ }

          # 5. Déplacement des fichiers à la racine
          Move-Item public\* . -Force
          Remove-Item public -Recurse -Force

          # 6. Commit et Push forcé sur la branche gh-pages
          git add index.html
          if (Test-Path Planning_Voitures_Tallard.xlsx) { git add Planning_Voitures_Tallard.xlsx }
          git commit -m "Mise à jour automatique du planning"
          git push origin gh-pages-temp:gh-pages --force
