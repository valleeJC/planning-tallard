name: Actualisation du Planning

on:
  schedule:
    - cron: '0 6 * * *'  # Tous les jours à 8h (heure française)
  workflow_dispatch:      # Lancement manuel

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Télécharge tout le dépôt Git avec le dossier .git

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests icalendar pandas openpyxl urllib3

      - name: Exécuter le script
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python update_planning.py

      - name: Déployer sur gh-pages (PowerShell)
        shell: powershell
        run: |
          # Ajout du chemin Git au PATH
          $env:Path += ";C:\Program Files\Git\cmd;C:\Program Files\Git\bin"

          # 1. Configuration de l'identité Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Création/bascule sur la branche temporaire
          git checkout --orphan gh-pages-temp

          # 3. Nettoyage et préparation des fichiers
          git rm -rf .
          New-Item -ItemType Directory -Force -Path public
          Copy-Item Planning_Voitures_Tallard.html public\index.html
          if (Test-Path Planning_Voitures_Tallard.xlsx) { Copy-Item Planning_Voitures_Tallard.xlsx public\ }

          # 4. Déplacement des fichiers à la racine
          Move-Item public\* . -Force
          Remove-Item public -Recurse -Force

          # 5. Commit et Push forcé sur gh-pages
          git add index.html
          if (Test-Path Planning_Voitures_Tallard.xlsx) { git add Planning_Voitures_Tallard.xlsx }
          git commit -m "Mise à jour automatique du planning"
          git push origin gh-pages-temp:gh-pages --force
